name: CI Full

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake libssl-dev

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: /usr/local/boost_1_91
          key: boost-1.91.0-${{ runner.os }}-v1

      - name: Build Boost 1.91.0
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          BOOST_ROOT=/usr/local/boost_1_91
          wget -q https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.gz
          tar xzf boost_1_91_0.tar.gz
          cd boost_1_91_0
          ./bootstrap.sh --prefix=${BOOST_ROOT} --with-libraries=json,url,filesystem
          sudo ./b2 install -j$(nproc) --prefix=${BOOST_ROOT} --with-json --with-url --with-filesystem variant=release link=shared threading=multi
          sudo ldconfig ${BOOST_ROOT}/lib
        env:
          BOOST_ROOT: /usr/local/boost_1_91

      - name: Setup Boost env
        run: echo "BOOST_ROOT=/usr/local/boost_1_91" >> $GITHUB_ENV

      - name: Build yaml-cpp 0.9.0
        run: |
          git clone --depth 1 --branch yaml-cpp-0.9.0 https://github.com/jbeder/yaml-cpp.git
          cd yaml-cpp
          cmake -DCMAKE_BUILD_TYPE=Release -DYAML_BUILD_SHARED_LIBS=ON -B build
          cmake --build build -j$(nproc)
          sudo cmake --install build

      - name: Build Google Test
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/google/googletest.git
          cd googletest
          cmake -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build -j$(nproc)
          sudo cp build/lib/libgtest*.a /usr/local/lib/
          sudo cp -r googletest/include/gtest /usr/local/include/
          sudo cp -r googlemock/include/gmock /usr/local/include/

      - name: Build Google Benchmark
        run: |
          git clone --depth 1 --branch v1.8.5 https://github.com/google/benchmark.git
          cd benchmark
          cmake -DCMAKE_BUILD_TYPE=Release -DBENCHMARK_ENABLE_TESTING=OFF -B build
          cmake --build build -j$(nproc)
          sudo cmake --install build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: module/core
        run: cd module/core && bash test_build.sh

      - name: module/app
        run: cd module/app && bash test_build.sh

      - name: module/llm
        run: cd module/llm && bash test_build.sh

      - name: module/agent
        run: cd module/agent && bash test_build.sh

      - name: shared/game
        run: cd desktop/app/shared/game && bash test_build.sh

      - name: snake/backend
        run: cd desktop/app/snake/backend && bash test_build.sh

      - name: gomoku/backend
        run: cd desktop/app/gomoku/backend && bash test_build.sh

      - name: pacman/backend
        run: cd desktop/app/pacman/backend && bash test_build.sh

      - name: go/backend
        run: cd desktop/app/go/backend && bash test_build.sh

      - name: chat/backend
        run: cd desktop/app/chat/backend && bash test_build.sh

      - name: filemanager/backend
        run: cd desktop/app/filemanager/backend && bash test_build.sh

      - name: terminal/backend
        run: cd desktop/app/terminal/backend && bash test_build.sh || true

      - name: C++ cmake build (full)
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Start server
        run: |
          echo '{"port":3099,"fileRoot":"/tmp"}' > config.json
          LD_LIBRARY_PATH=build/output/lib:${BOOST_ROOT}/lib ./build/output/AImeath &
          for i in $(seq 1 30); do
            nc -z localhost 3099 && break
            sleep 1
          done

      - name: Install test deps
        run: cd test && npm ci

      - name: Integration ws_smoke
        run: cd test && node ws_smoke.js --port=3099

      - name: Frontend npm install
        run: cd desktop && npm ci --ignore-scripts

      - name: Frontend vitest
        run: cd desktop && npx vitest run
