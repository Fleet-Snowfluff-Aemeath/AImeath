name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ====== C++ Backend Tests ======
  cpp-tests:
    name: C++ Backend Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev libbenchmark-dev libssl-dev

      - name: Build and test module/core
        run: cd module/core && bash test_build.sh

      - name: Build and test module/app
        run: cd module/app && bash test_build.sh

      - name: Build and test module/llm
        run: cd module/llm && bash test_build.sh

      - name: Build and test module/agent
        run: cd module/agent && bash test_build.sh

      - name: Build and test shared/game
        run: cd desktop/app/shared/game && bash test_build.sh

      - name: Build and test snake/backend
        run: cd desktop/app/snake/backend && bash test_build.sh

      - name: Build and test gomoku/backend
        run: cd desktop/app/gomoku/backend && bash test_build.sh

      - name: Build and test pacman/backend
        run: cd desktop/app/pacman/backend && bash test_build.sh

      - name: Build and test go/backend
        run: cd desktop/app/go/backend && bash test_build.sh

      - name: Build and test chat/backend
        run: cd desktop/app/chat/backend && bash test_build.sh

      - name: Build and test filemanager/backend
        run: cd desktop/app/filemanager/backend && bash test_build.sh

      - name: Build and test terminal/backend
        run: cd desktop/app/terminal/backend && bash test_build.sh

  # ====== Frontend Tests (Vitest) ======
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd desktop && npm ci

      - name: Run vitest
        run: cd desktop && npx vitest run

  # ====== Integration Tests ======
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: cpp-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: cd test && npm ci

      - name: Run ws_smoke
        run: cd test && node ws_smoke.js
